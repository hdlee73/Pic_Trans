<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Snap Read</title>
  <link rel="stylesheet" href="style.css">
  <!-- 앱 안에 포함된 Tesseract.js (npm run vendor 로 복사). 없으면 CDN 사용 -->
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script>
    if (!window.Tesseract) document.write('<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"><\/script>');
  </script>
</head>
<body class="mode-home">
  <!-- 아이콘 (선만 쓰는 단순한 모양) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>
      <symbol id="i-flip" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v3.5h3.5M4 13a8 8 0 0 0 14.5 4M20 20v-3.5h-3.5"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.2-2h5.6L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.2"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v4.5h-4.5"/></symbol>
      <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></symbol>
      <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15M8 10h8M8 14h5"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v10M7.5 10l4.5 4.5 4.5-4.5M5 17v1.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V17"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/></symbol>
    </defs>
  </svg>

  <main class="app">
    <!-- 카메라 / 찍은 사진 (같은 자리에서 전환) -->
    <section class="panel stage" id="stage">
      <div class="media" id="media">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" hidden></canvas>
        <div id="selection" class="selection" hidden></div>
        <button id="btn-info" class="icon-btn info-btn" title="앱 정보" aria-label="앱 정보">
          <svg class="ic"><use href="#i-info"/></svg><span id="info-dot" class="dot" hidden></span>
        </button>
        <button id="btn-menu" class="icon-btn menu-btn" title="메뉴로" aria-label="메뉴로"><svg class="ic"><use href="#i-menu"/></svg></button>
        <div id="live-layer" class="live-layer" hidden></div>
        <div id="live-bar" class="live-bar" hidden><span id="live-title"></span><button id="live-stop" class="btn" type="button">끄기</button></div>
        <p id="camera-msg" class="placeholder">카메라를 시작하는 중…</p>
        <p id="photo-hint" class="hint" hidden>두 손가락으로 확대 · 글자 부분을 드래그하면 그 부분만 인식합니다</p>
      </div>

      <div class="controls camera-controls" id="camera-controls">
        <label class="icon-btn" title="사진 선택" aria-label="사진 선택">
          <svg class="ic"><use href="#i-image"/></svg>
          <input id="file-input" type="file" accept="image/*" hidden>
        </label>
        <button id="btn-capture" class="shutter" title="촬영" aria-label="촬영"></button>
        <button id="btn-switch" class="icon-btn" title="카메라 전환" aria-label="카메라 전환">
          <svg class="ic"><use href="#i-flip"/></svg>
        </button>
      </div>

      <div class="controls photo-controls" id="photo-controls" hidden>
        <div class="tools">
          <button id="btn-retake" class="icon-btn" title="다시 찍기" aria-label="다시 찍기"><svg class="ic"><use href="#i-camera"/></svg></button>
          <button id="btn-rotate" class="icon-btn" title="사진 돌리기" aria-label="사진 돌리기"><svg class="ic"><use href="#i-rotate"/></svg></button>
          <button id="btn-scan" class="icon-btn" title="스캔 저장" aria-label="스캔 저장"><svg class="ic"><use href="#i-save"/></svg></button>
          <button id="btn-search" class="icon-btn" title="구글 이미지 검색" aria-label="구글 이미지 검색"><svg class="ic"><use href="#i-search"/></svg></button>
          <button id="btn-full" class="icon-btn" title="전체 인식" aria-label="전체 인식" hidden><svg class="ic"><use href="#i-full"/></svg></button>
        </div>
        <button id="btn-open-result" class="btn primary">번역</button>
      </div>
    </section>

    <!-- 번역 결과 팝업 (번역 버튼을 누르면 나옴) -->
    <div id="popup" class="popup" hidden>
      <!-- 추출된 문자 + 한국어 번역 -->
      <section class="panel results" id="results" role="dialog" aria-modal="true" aria-label="번역 결과">
        <button id="btn-close-result" class="close-btn" title="닫기" aria-label="닫기"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div class="block" id="block-ocr">
          <header>
            <h2>추출된 문자</h2>
            <select id="ocr-lang" title="사진 속 글자의 언어" aria-label="사진 속 글자의 언어">
              <option value="eng">영어</option>
              <option value="kor">한국어</option>
              <option value="jpn">일본어</option>
              <option value="jpn_vert">일본어 (세로쓰기)</option>
              <option value="chi_sim">중국어 간체</option>
              <option value="chi_sim_vert">중국어 간체 (세로쓰기)</option>
              <option value="chi_tra">중국어 번체</option>
              <option value="chi_tra_vert">중국어 번체 (세로쓰기)</option>
              <option value="fra">프랑스어</option>
              <option value="deu">독일어</option>
              <option value="spa">스페인어</option>
              <option value="rus">러시아어</option>
              <option value="vie">베트남어</option>
              <option value="tha">태국어</option>
            </select>
            <span id="ocr-status" class="status"></span>
          </header>
          <textarea id="ocr-text" placeholder="사진에서 추출한 문자가 여기에 표시됩니다. 직접 고칠 수도 있습니다."></textarea>
        </div>

        <div class="block" id="block-trans">
          <header>
            <h2>한국어 번역</h2>
            <span id="trans-status" class="status"></span>
          </header>
          <textarea id="trans-text" readonly placeholder="번역 결과가 여기에 표시됩니다."></textarea>
          <footer>
            <label class="check"><input id="auto-run" type="checkbox" checked> 촬영 후 자동 추출</label>
            <button id="btn-copy" class="btn" title="번역 복사"><svg class="ic"><use href="#i-copy"/></svg>복사</button>
            <button id="btn-translate" class="btn primary" disabled>다시 번역</button>
          </footer>
        </div>
      </section>
    </div>
  </main>

  <!-- 스캔 저장 -->
  <div id="scan-overlay" class="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="scan-title">
      <h2 id="scan-title">스캔 저장</h2>
      <canvas id="scan-preview" class="scan-preview"></canvas>
      <p id="scan-scope" class="status"></p>
      <div class="seg" id="scan-filter" role="radiogroup" aria-label="보정">
        <label><input type="radio" name="scan-filter" value="bw" checked><span>문서(흑백)</span></label>
        <label><input type="radio" name="scan-filter" value="gray"><span>그레이</span></label>
        <label><input type="radio" name="scan-filter" value="color"><span>원본</span></label>
      </div>
      <div class="seg" id="scan-format" role="radiogroup" aria-label="형식">
        <label><input type="radio" name="scan-format" value="pdf" checked><span>PDF</span></label>
        <label><input type="radio" name="scan-format" value="jpg"><span>이미지(JPG)</span></label>
      </div>
      <p id="scan-status" class="status"></p>
      <div class="sheet-actions">
        <button id="scan-save" class="btn primary" type="button">저장</button>
        <button id="scan-close" class="btn" type="button">닫기</button>
      </div>
    </section>
  </div>

  <!-- 첫 화면: 메뉴 (고르면 해당 촬영 화면으로) -->
  <section id="home" class="home" aria-label="메뉴">
    <button id="home-info" class="icon-btn info-btn" title="앱 정보" aria-label="앱 정보">
      <svg class="ic"><use href="#i-info"/></svg><span id="home-info-dot" class="dot" hidden></span>
    </button>
    <h1>Snap Read</h1>
    <p class="status">무엇을 할까요? 고르면 촬영 화면이 열립니다</p>
    <div class="menu-grid">
      <button class="menu-item" data-act="translate" type="button"><b>사진 번역</b><small>찍은 사진 속 글자를 추출해 한국어로</small></button>
      <button class="menu-item" data-act="ar" type="button"><b>실시간 번역</b><small>카메라 화면 위에 바로 번역 표시</small></button>
      <button class="menu-item" data-act="scan" type="button"><b>스캔 저장</b><small>문서를 PDF·JPG로 보정해 저장</small></button>
      <button class="menu-item" data-act="search" type="button"><b>구글 이미지 검색</b><small>찍은 사진으로 구글 렌즈 검색</small></button>
      <button class="menu-item" data-act="card" type="button"><b>명함 저장</b><small>이름·전화·이메일을 연락처로</small></button>
      <button class="menu-item" data-act="table" type="button"><b>표 → CSV</b><small>사진 속 표를 엑셀 파일로</small></button>
      <button class="menu-item" data-act="vocab" type="button"><b>단어장에 담기</b><small>추출한 글자에서 고른 단어 저장</small></button>
      <button class="menu-item" data-act="qr" type="button"><b>QR·바코드</b><small>링크 열기, 와이파이, 상품 검색</small></button>
      <button class="menu-item" data-act="library" type="button"><b>보관함</b><small>명함 · 단어장</small></button>
    </div>
  </section>

  <!-- 편집·결과 시트 (명함/표/QR 결과 공용) -->
  <div id="form-overlay" class="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="form-title">
      <h2 id="form-title"></h2>
      <div id="form-body"></div>
      <p id="form-status" class="status"></p>
      <div class="sheet-actions" id="form-actions"></div>
    </section>
  </div>

  <!-- 앱 정보 -->
  <div id="info-overlay" class="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="info-title">
      <h2 id="info-title">Snap Read</h2>
      <dl class="info-list">
        <dt>버전</dt><dd id="info-version">-</dd>
        <dt>만든이</dt><dd>이현덕 · <a href="mailto:hdlee73@gmail.com">hdlee73@gmail.com</a></dd>
        <dt>업데이트</dt><dd id="info-update" class="update-line">확인 중…</dd>
      </dl>
      <div class="sheet-actions">
        <a id="info-release" class="btn primary" href="https://github.com/hdlee73/SnapRead/releases" target="_blank" rel="noopener">GitHub 릴리스 페이지</a>
        <button id="info-recheck" class="btn" type="button">업데이트 확인</button>
        <button id="info-close" class="btn" type="button">닫기</button>
      </div>
    </section>
  </div>

  <script src="vendor/jsqr.js"></script>
  <script src="app.js"></script>
  <script src="features.js"></script>
</body>
</html>
