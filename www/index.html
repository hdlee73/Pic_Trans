<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Pic Trans</title>
  <link rel="stylesheet" href="style.css">
  <!-- 앱 안에 포함된 Tesseract.js (npm run vendor 로 복사). 없으면 CDN 사용 -->
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script>
    if (!window.Tesseract) document.write('<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"><\/script>');
  </script>
</head>
<body class="mode-camera">
  <main class="app">
    <!-- 카메라 / 찍은 사진 (같은 자리에서 전환) -->
    <section class="panel stage" id="stage">
      <div class="media" id="media">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" hidden></canvas>
        <div id="selection" class="selection" hidden></div>
        <p id="camera-msg" class="placeholder">카메라를 시작하는 중…</p>
        <p id="photo-hint" class="hint" hidden>글자 부분을 손가락으로 드래그하면 그 부분만 인식합니다</p>
      </div>
      <div class="controls" id="camera-controls">
        <label class="button round" title="사진 선택">
          🖼️
          <input id="file-input" type="file" accept="image/*" hidden>
        </label>
        <button id="btn-capture" class="shutter" title="촬영" aria-label="촬영"></button>
        <button id="btn-switch" class="round" title="카메라 전환">🔄</button>
      </div>
      <div class="controls" id="photo-controls" hidden>
        <button id="btn-retake">📷 다시 찍기</button>
        <button id="btn-full" hidden>⬜ 전체 인식</button>
        <button id="btn-ocr" class="primary">🔍 문자 추출</button>
      </div>
    </section>

    <!-- 추출된 문자 + 한국어 번역 -->
    <section class="panel results" id="results">
      <div class="block" id="block-ocr">
        <header>
          <h2>추출된 문자</h2>
          <select id="ocr-lang" title="사진 속 글자의 언어">
            <option value="eng">영어</option>
            <option value="jpn">일본어</option>
            <option value="chi_sim">중국어(간체)</option>
            <option value="chi_tra">중국어(번체)</option>
            <option value="fra">프랑스어</option>
            <option value="deu">독일어</option>
            <option value="spa">스페인어</option>
            <option value="rus">러시아어</option>
            <option value="vie">베트남어</option>
            <option value="tha">태국어</option>
          </select>
          <span id="ocr-status" class="status"></span>
        </header>
        <textarea id="ocr-text" placeholder="사진에서 추출한 문자·숫자가 여기에 표시됩니다. 직접 고칠 수도 있습니다."></textarea>
      </div>
      <div class="block" id="block-trans">
        <header>
          <h2>한국어 번역</h2>
          <span id="trans-status" class="status"></span>
        </header>
        <textarea id="trans-text" readonly placeholder="번역 결과가 여기에 표시됩니다."></textarea>
        <footer>
          <label class="check"><input id="auto-run" type="checkbox" checked> 촬영 후 자동 추출·번역</label>
          <button id="btn-copy">📋 복사</button>
          <button id="btn-translate" class="primary" disabled>🌐 번역</button>
        </footer>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
