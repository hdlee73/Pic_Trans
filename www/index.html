<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2937">
  <title>Pic Trans</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <main class="grid">
    <!-- 1. 카메라 -->
    <section class="panel" id="panel-camera">
      <header>
        <h2>① 카메라</h2>
        <button id="btn-switch" class="icon" title="카메라 전환">🔄</button>
      </header>
      <div class="body media">
        <video id="video" autoplay playsinline muted></video>
        <p id="camera-msg" class="placeholder">카메라를 시작하는 중…</p>
      </div>
      <footer>
        <button id="btn-capture" class="primary">📸 촬영</button>
        <label class="button">
          🖼️ 사진 선택
          <input id="file-input" type="file" accept="image/*" hidden>
        </label>
      </footer>
    </section>

    <!-- 2. 찍은 사진 -->
    <section class="panel" id="panel-photo">
      <header><h2>② 찍은 사진</h2></header>
      <div class="body media">
        <canvas id="canvas" hidden></canvas>
        <p id="photo-msg" class="placeholder">촬영한 사진이 여기에 표시됩니다.</p>
      </div>
      <footer>
        <select id="ocr-lang" title="인식할 언어">
          <option value="eng">영어</option>
          <option value="jpn">일본어</option>
          <option value="chi_sim">중국어(간체)</option>
          <option value="chi_tra">중국어(번체)</option>
          <option value="fra">프랑스어</option>
          <option value="deu">독일어</option>
          <option value="spa">스페인어</option>
          <option value="rus">러시아어</option>
          <option value="vie">베트남어</option>
          <option value="tha">태국어</option>
        </select>
        <button id="btn-ocr" class="primary" disabled>🔍 문자 추출</button>
      </footer>
    </section>

    <!-- 3. 추출된 문자 -->
    <section class="panel" id="panel-text">
      <header>
        <h2>③ 추출된 문자</h2>
        <span id="ocr-status" class="status"></span>
      </header>
      <div class="body">
        <textarea id="ocr-text" placeholder="사진에서 추출한 문자·숫자가 여기에 표시됩니다. 직접 수정할 수도 있습니다."></textarea>
      </div>
      <footer>
        <button id="btn-translate" class="primary" disabled>🌐 한국어로 번역</button>
      </footer>
    </section>

    <!-- 4. 한국어 번역 -->
    <section class="panel" id="panel-trans">
      <header>
        <h2>④ 한국어 번역</h2>
        <span id="trans-status" class="status"></span>
      </header>
      <div class="body">
        <textarea id="trans-text" readonly placeholder="번역 결과가 여기에 표시됩니다."></textarea>
      </div>
      <footer>
        <label class="check"><input id="auto-run" type="checkbox" checked> 촬영 후 자동 추출·번역</label>
        <button id="btn-copy">📋 복사</button>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
